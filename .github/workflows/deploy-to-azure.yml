name: Deploy to Azure

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IMAGE_NAME: order-service
  CONTAINER_NAME: order-service
  CONTAINER_PORT: '3005'
  DOCKER_NETWORK: deliveroo-dev
  SERVICE_DIR: /opt/deliveroo/order-service

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: mongodb://localhost:27017/order-service

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run types:check

      - name: Build
        run: npm run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
          HUSKY: 0
        run: npx semantic-release

  extract-version:
    name: Extract Release Version
    needs: release
    uses: ./.github/workflows/extract-version.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: extract-version
    if: needs.extract-version.outputs.published == 'true'
    environment: ${{ inputs.environment }}

    env:
      APP_VERSION: ${{ needs.extract-version.outputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER_DEV }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.extract-version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME_DEV }}
          password: ${{ secrets.ACR_PASSWORD_DEV }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            ENV=${{ env.ENVIRONMENT }}
            DATABASE_URL=mongodb://localhost:27017/order-service
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:develop-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    name: Deploy to Azure VM
    runs-on: self-hosted
    timeout-minutes: 10
    needs:
      - extract-version
      - build-and-push
    if: needs.extract-version.outputs.published == 'true'
    environment: ${{ inputs.environment }}

    env:
      APP_VERSION: ${{ needs.extract-version.outputs.version }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER_DEV }}

    steps:
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME_DEV }}
          password: ${{ secrets.ACR_PASSWORD_DEV }}

      - name: Pull and restart order service
        run: |
          set -eu

          mkdir -p "$SERVICE_DIR"
          cat > "$SERVICE_DIR/.env" <<'ORDER_SERVICE_ENV'
          ${{ secrets.ORDER_SERVICE_ENV_DEV }}
          ORDER_SERVICE_ENV
          chmod 600 "$SERVICE_DIR/.env"
          if ! grep -q '^DATABASE_URL=' "$SERVICE_DIR/.env"; then
            echo "ORDER_SERVICE_ENV_DEV must include DATABASE_URL"
            exit 1
          fi

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

          docker pull "$ACR_LOGIN_SERVER/$IMAGE_NAME:$APP_VERSION"

          if docker ps -a --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
            docker rm -f "$CONTAINER_NAME"
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --network "$DOCKER_NETWORK" \
            --restart unless-stopped \
            --env-file "$SERVICE_DIR/.env" \
            -e APP_VERSION="$APP_VERSION" \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$APP_VERSION"

          sleep 10

          if ! docker ps --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
            docker logs "$CONTAINER_NAME" --tail 100
            exit 1
          fi

          docker run --rm \
            --network "$DOCKER_NETWORK" \
            curlimages/curl:8.10.1 \
            --fail \
            --silent \
            --show-error \
            "http://$CONTAINER_NAME:$CONTAINER_PORT/"

          docker image prune -f
